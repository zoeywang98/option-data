name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m option_data validate examples/runs/2026-08-14/SPX/155800
      - name: Validate tracked market-data runs
        run: |
          find runs -name manifest.json -print0 | while IFS= read -r -d '' manifest; do
            python -m option_data validate "$(dirname "$manifest")" || exit 1
          done
